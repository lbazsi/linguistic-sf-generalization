config_version: "1.6"
schema_version: "1.5"
prompt_version: "1.4"

models:
  generator: "google/gemini-3.8-flash"
  judge: "openai/gpt-5.6-luna"
  reviewer: "anthropic/claude-haiku-4.5"

providers:
  generator:
    only: ["google-ai-studio"]
    allow_fallbacks: false
  judge:
    only: ["openai"]
    allow_fallbacks: false
  reviewer:
    only: ["anthropic"]
    allow_fallbacks: false

reasoning_effort:
  generator: "low"
  judge: "medium"
  reviewer: "medium"

temperatures:
  generator: 0.7
  judge: null
  reviewer: null

concurrency: 8
batch_size: 20

seeds:
  generator: 42
  judge: null
  reviewer: null

retry_limits:
  max_attempts: 5
  backoff_seconds: 2
  max_backoff_seconds: 30

dataset_size: 5000
canonical_language: "en"

lexical_diversity:
  tokenizer_model: "google/gemma-2-9b"
  tokenizer_revision: "main"
  mattr_window: 50

api:
  base_url: "https://openrouter.ai/api/v1"
  timeout_seconds: 120
  max_output_tokens: 8000
  require_parameters: true

paths:
  domains: "config/domains.yaml"
  held_out_domains: "config/held_out_domains.yaml"
  features: "features"
  prompts: "prompts"
  canonical: "data/canonical"
  language_controls: "data/language_controls"
  lexical_diversity: "data/metrics/lexical_diversity"
  raw: "data/raw"
  first_review: "data/first_review"
  final: "data/final"
  deterministic_issues: "data/issues/deterministic"
  nondeterministic_issues: "data/issues/non-deterministic"
  manifests: "data/manifests"
