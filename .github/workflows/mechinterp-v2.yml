name: Mechanistic V2 CPU validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'mechanistic-interpretability/**'
      - 'cross-model-analysis/**'
      - '.github/workflows/mechinterp-v2.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'scipy>=1.13,<2' 'scikit-learn>=1.4,<2' 'safetensors>=0.5,<1' 'PyYAML>=6,<7' 'pytest>=8,<10' 'transformers>=4.53,<5' 'peft>=0.15,<1' 'accelerate>=1,<2' 'matplotlib>=3.8,<4' 'Pillow>=10.4,<12' 'httpx>=0.27,<1' 'jsonschema>=4,<5'
      - name: Compile all analysis modules
        run: python -m compileall -q mechanistic-interpretability cross-model-analysis
      - name: Mechanistic unit tests
        working-directory: mechanistic-interpretability
        run: python -m pytest tests -q
      - name: Audit classifier lexical and length controls on real datasets
        working-directory: mechanistic-interpretability
        run: python -m mechinterp.classifier_controls --model llama31
      - uses: actions/upload-artifact@v4
        with:
          name: classifier-controls-revision2
          path: mechanistic-interpretability/outputs/llama31/linear-probing/classifier_control_audit.json
          if-no-files-found: error
      - name: Cross-model regression tests
        run: python -m unittest discover -s cross-model-analysis/tests -v
      - name: Generate archived cross-model tables and figures
        run: python cross-model-analysis/run.py --stage all --output /tmp/cross-model-v2-validation --figure-dpi 150
      - name: Check figures manifest
        run: python -c 'import json; from pathlib import Path; p=Path("/tmp/cross-model-v2-validation/figures/manifest.json"); assert p.exists(); x=json.loads(p.read_text()); assert x["generated"]>0'
