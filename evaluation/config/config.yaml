config_version: "1.2"
schema_version: "1.0"
prompt_version: "1.0"

models:
  scenario_generator: "anthropic/claude-sonnet-5.5"
  scenario_judge: "google/gemini-3.8-flash"
  response_judge_1: "openai/gpt-5.6-sol"
  response_judge_2: "anthropic/claude-sonnet-5.5"

providers:
  scenario_generator:
    only: ["anthropic"]
    allow_fallbacks: false
  scenario_judge:
    only: ["google-ai-studio"]
    allow_fallbacks: false
  response_judge_1:
    only: ["openai"]
    allow_fallbacks: false
  response_judge_2:
    only: ["anthropic"]
    allow_fallbacks: false

reasoning_effort:
  scenario_generator: "medium"
  scenario_judge: "low"
  response_judge_1: "medium"
  response_judge_2: "medium"

temperatures:
  scenario_generator: null
  scenario_judge: 0.0
  response_judge_1: null
  response_judge_2: null

seeds:
  scenario_plan: 42
  scenario_generator: null
  scenario_judge: 44
  response_generation: 45
  response_judge_1: null
  response_judge_2: null

scenario_generation:
  scenarios_per_category: 100
  tradeoff_fraction: 0.5
  batch_size: 20

model_generation:
  batch_size: 8
  max_new_tokens: 96
  temperature: 0.2
  top_p: 0.95
  do_sample: true
  training_seed: 42
  torch_dtype: "bfloat16"
  attn_implementation: "eager"

judging:
  batch_size: 10
  shuffle_seeds:
    judge_1: 46
    judge_2: 47

api:
  base_url: "https://openrouter.ai/api/v1"
  timeout_seconds: 120
  max_output_tokens: 8000
  max_attempts: 5
  backoff_seconds: 2
  max_backoff_seconds: 30
  concurrency: 8
  require_parameters: true

paths:
  training_domains: "../synthetic_data_generation/LoRA_training/config/domains.yaml"
  held_out_domains: "../synthetic_data_generation/LoRA_training/config/held_out_domains.yaml"
  fine_tuning_outputs: "../fine_tuning/outputs"
  raw_scenarios: "data/scenarios/raw/scenarios.jsonl"
  final_scenarios: "data/scenarios/final/scenarios.jsonl"
  responses: "data/responses"
  judgments: "data/judgments"
  aggregated: "data/aggregated"
  manifests: "data/manifests"
  lexical_diversity_metrics: "../synthetic_data_generation/LoRA_training/data/metrics/lexical_diversity"
